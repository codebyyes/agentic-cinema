openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: production
    description: Film production package generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /production-package:
    post:
      operationId: createProductionPackage
      tags: [production]
      summary: Generate a complete film production package
      description: Analyzes a feeling or story premise and returns production-ready creative direction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionPackageInput"
      responses:
        "200":
          description: Generated production package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionPackage"
        "400":
          description: Invalid story input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductionPackageInput:
      type: object
      properties:
        story:
          type: string
          minLength: 10
          maxLength: 12000
          description: A feeling, memory, or story idea to transform into a film package
      required:
        - story
    ProductionPackage:
      type: object
      properties:
        title:
          type: string
        logline:
          type: string
        emotionalCore:
          type: string
        script:
          type: string
        dialogue:
          type: array
          description: Dialogue blocks formatted for screenplay presentation
          items:
            $ref: "#/components/schemas/DialogueBlock"
        camera:
          type: string
        lighting:
          type: string
        music:
          type: string
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/ProductionScene"
      required:
        - title
        - logline
        - emotionalCore
        - script
        - dialogue
        - camera
        - lighting
        - music
        - scenes
    ProductionScene:
      type: object
      properties:
        number:
          type: number
        heading:
          type: string
        description:
          type: string
        visualBeat:
          type: string
        soundBeat:
          type: string
        shotType:
          type: string
          description: The framing, such as close-up, wide shot, or POV
        lens:
          type: string
          description: Lens focal length, including the millimeter value
        movement:
          type: string
          description: Camera movement, such as dolly, handheld, crane, or drone
      required:
        - number
        - heading
        - description
        - visualBeat
        - soundBeat
        - shotType
        - lens
        - movement
    DialogueBlock:
      type: object
      properties:
        character:
          type: string
          description: Character name displayed above the dialogue line
        parenthetical:
          type: string
          description: Optional screenplay direction spoken beneath the character name
        line:
          type: string
          description: The spoken dialogue
      required:
        - character
        - line
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

